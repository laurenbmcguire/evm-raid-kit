# Roadmap for the evm-raid-kit repository, managed by the AI PM (python -m evmkit pm).
project: evm-raid-kit
milestones:
  - id: M1
    name: EVM engine
    due: 2026-10-16
    status: done
    done_criteria: PV linear spread, EV, AC from timesheets, SV/CV/SPI/CPI, 3 EAC methods, ETC, VAC, TCPI; formulas tested against hand-computed values
  - id: M2
    name: Earned schedule and CPM
    due: 2026-10-23
    status: done
    done_criteria: ES, SPI(t), IEAC(t) forecast finish; CPM forward/backward pass with total and free float on a working-day calendar; tests pass
  - id: M3
    name: RAID analytics and RAG rules
    due: 2026-10-27
    status: done
    done_criteria: risk scoring, 5x5 heatmap, overdue and aging items, issues by owner; explicit RAG rules for scope, schedule, cost and risk
  - id: M4
    name: Report generator and charts
    due: 2026-10-30
    status: done
    done_criteria: reports/status_report.md one-pager, reports/summary.json and five brand charts produced by python -m evmkit run
  - id: M5
    name: AI PM and CI workflows
    due: 2026-11-02
    status: done
    done_criteria: deterministic STATUS.md and status.json, optional grounded LLM summary, CI matrix and weekly AI PM workflow
  - id: M6
    name: Data quality guards
    due: 2026-11-20
    status: in_progress
    done_criteria: percent-complete validation, timesheet lag check and a baseline change log, each with tests and a section in the report
  - id: M7
    name: Excel and Smartsheet import (planned)
    due: 2026-12-18
    status: planned
    done_criteria: read plan, timesheet and RAID data from .xlsx and Smartsheet CSV exports with column mapping and validation errors
  - id: M8
    name: Power BI template (planned)
    due: 2027-01-29
    status: planned
    done_criteria: tidy long-format export plus a documented Power BI template that reproduces the S-curves, indices and RAID views

