# Project risks for the evm-raid-kit repository (probability and impact on 1-5 scales).
risks:
  - id: R1
    risk: Inaccurate percent complete inflates EV and hides overruns
    probability: 4
    impact: 4
    owner: Lauren
    mitigation: B11 validation rules; define physical progress criteria per task type
    status: open
  - id: R2
    risk: Timesheet lag understates AC, so CPI looks better than reality
    probability: 3
    impact: 4
    owner: AI PM
    mitigation: B12 lag check; accrue estimated cost for missing timesheet weeks
    status: open
  - id: R3
    risk: Baseline changes without change control mask true variance
    probability: 3
    impact: 5
    owner: Lauren
    mitigation: B10 baseline change log; report re-baselines with change-request ids
    status: open
  - id: R4
    risk: Linear PV spread misrepresents front- or back-loaded tasks
    probability: 3
    impact: 3
    owner: AI PM
    mitigation: Document the assumption; add optional per-task spread curves after M7
    status: monitoring
  - id: R5
    risk: Excel and Smartsheet exports vary in columns and date formats
    probability: 3
    impact: 3
    owner: AI PM
    mitigation: Column mapping file and strict loader validation with clear errors (M7)
    status: open
  - id: R6
    risk: Power BI template drifts from the summary.json schema
    probability: 2
    impact: 3
    owner: Lauren
    mitigation: Versioned export schema and a test that checks required fields (M8)
    status: open
  - id: R7
    risk: Synthetic sample data is cleaner than real project data
    probability: 3
    impact: 2
    owner: Lauren
    mitigation: State it in the README; loaders reject malformed input instead of guessing
    status: monitoring
  - id: R8
    risk: LLM summary states facts that are not in the computed JSON
    probability: 2
    impact: 4
    owner: AI PM
    mitigation: Prompt restricted to the facts JSON; deterministic fallback; tests never call the network
    status: monitoring
