[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evmkit"
version = "0.1.0"
description = "Earned value, earned schedule, critical path and RAID analytics that produce an executive status report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lauren McGuire" }]
keywords = ["earned-value-management", "project-management", "critical-path", "raid-log", "pmo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
evmkit = "evmkit.cli:main"

[project.urls]
Homepage = "https://github.com/laurenbmcguire/evm-raid-kit"
Author = "https://laurenmcguireresume.com"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
